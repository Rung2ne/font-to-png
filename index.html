<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font to PNG</title>
    <!-- 모던 컬러피커 라이브러리 (Pickr) css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Font to PNG</h1>
    
    <div class="form-group">
        <label for="textInput">텍스트</label>
        <input type="text" id="textInput" placeholder="여기에 글자를 입력하세요">
    </div>

    <div class="form-group">
        <label for="fontInput">폰트 파일 (ttf, otf, ttc, woff, woff2)</label>
        <input type="file" id="fontInput" accept=".ttf, .otf, .ttc, .woff, .woff2">
    </div>

    <div class="form-group">
        <label for="fontSize">폰트 크기 (px)</label>
        <input type="number" id="fontSize" value="200">
    </div>

    <div class="form-group">
        <label for="padding">글자 주변 여백 (px)</label>
        <input type="number" id="padding" value="5">
    </div>

    <div class="form-group">
        <label>글자 색상 및 투명도</label>
        <div class="color-inputs-container">
            <div class="color-item color-item-picker">
                <span class="sub-label">컬러피커</span>
                <div id="textColorPicker"></div>
            </div>
            <div class="color-item">
                <span class="sub-label">HEX (16진수)</span>
                <input type="text" id="textColorHex" value="#FFFFFF" placeholder="#FFFFFF">
            </div>
            <div class="color-item">
                <span class="sub-label">RGB</span>
                <input type="text" id="textColorRgb" value="255, 255, 255" placeholder="255, 255, 255">
            </div>
            <div class="color-item">
                <span class="sub-label">투명도 (0~1)</span>
                <input type="number" id="textAlpha" min="0" max="1" step="0.01" value="0">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>배경 색상 및 투명도</label>
        <div class="color-inputs-container">
            <div class="color-item color-item-picker">
                <span class="sub-label">컬러피커</span>
                <div id="bgColorPicker"></div>
            </div>
            <div class="color-item">
                <span class="sub-label">HEX (16진수)</span>
                <input type="text" id="bgColorHex" value="#000000" placeholder="#000000">
            </div>
            <div class="color-item">
                <span class="sub-label">RGB</span>
                <input type="text" id="bgColorRgb" value="0, 0, 0" placeholder="0, 0, 0">
            </div>
            <div class="color-item">
                <span class="sub-label">투명도 (0~1)</span>
                <input type="number" id="bgAlpha" min="0" max="1" step="0.01" value="0">
            </div>
        </div>
    </div>

    <button id="generateBtn">PNG 생성 및 다운로드</button>
</div>

<div id="previewContainer">
    <canvas id="mainCanvas"></canvas>
</div>

<!-- 모던 컬러피커 라이브러리 js -->
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
<script src="script.js"></script>
</body>
</html>
